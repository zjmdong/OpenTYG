name: Container image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published application release tag (for example v1.2.3)'
        required: true
        default: v1.2.3
      operation:
        description: 'Publish an image, or verify anonymous pulls after making it public'
        required: true
        type: choice
        options: [publish, verify-public]
        default: publish
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: opentyg-container-release
  cancel-in-progress: false

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
      OPERATION: ${{ inputs.operation || 'publish' }}
      ARCH: ${{ matrix.arch }}
      IMAGE: ghcr.io/zjmdong/opentyg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
          persist-credentials: false
      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          test "$(node -p 'require("./package.json").version')" = "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build release image
        if: env.OPERATION == 'publish'
        run: |
          docker build --platform "linux/$ARCH" --pull \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.url=https://github.com/zjmdong/OpenTYG/releases/tag/$RELEASE_TAG" \
            -t "$IMAGE:$VERSION-$ARCH" .
      - name: Pull image anonymously
        if: env.OPERATION == 'verify-public'
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker"
          mkdir -p "$DOCKER_CONFIG"
          docker pull --platform "linux/$ARCH" "$IMAGE:$VERSION"
          docker tag "$IMAGE:$VERSION" "$IMAGE:$VERSION-$ARCH"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE:$VERSION")" = "$REVISION"
      - name: Verify native WebSocket cancellation and bounded retry
        shell: bash
        run: |
          set -euo pipefail
          # This contract was introduced in v1.2.3; older immutable tags remain publishable.
          if [[ "$(printf '%s\n' "$VERSION" '1.2.3' | sort -V | head -n 1)" != '1.2.3' ]]; then exit 0; fi
          docker run --rm -i --entrypoint node "$IMAGE:$VERSION-$ARCH" --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import http from 'node:http';
          import { setTimeout as delay } from 'node:timers/promises';
          import { Session } from './server/service.mjs';
          import { ROUTES } from './server/vendor/tyg-core-sdk/src/tyg-client.mjs';
          const sockets = new Set(); let upgrades = 0, cancelled = 0;
          const server = http.createServer();
          server.on('upgrade', (req, socket) => {
            upgrades++; sockets.add(socket);
            socket.on('close', () => sockets.delete(socket)); socket.on('error', () => {});
            socket.on('end', () => socket.end());
            // Intentionally never finish the WS handshake: exercise native abort, not a mock WS class.
          });
          await new Promise(resolve => server.listen(0, '127.0.0.1', resolve));
          const origin = `http://127.0.0.1:${server.address().port}`;
          const fetchImpl = async (url, options) => {
            const path = new URL(url).pathname;
            if (path === ROUTES.doorAuth) return new Promise((resolve, reject) => {
              const abort = () => { cancelled++; reject(options.signal.reason); };
              if (options.signal.aborted) abort(); else options.signal.addEventListener('abort', abort, { once: true });
            });
            const payload = path === ROUTES.initialize
              ? { result: '0', serverConfigs: [] }
              : path === ROUTES.loginPassword
                ? { result: '0', code: '0', token: 'offline-ci-session', name: 'Fixture' }
                : { code: '0', data: { areaList: [{ organizationSeq: 'fixture-org', list: [{ householdSerial: 'fixture-room', mobile: 'fixture-mobile', token: 'offline-ci-household', valid: '1' }] }] } };
            return new Response(JSON.stringify(payload), { headers: { 'Content-Type': 'application/json' } });
          };
          const session = new Session('fixture', { origin, deviceId: 'fixture-device', transport: {
            allowInsecureTransport: true, fetchImpl, connectTimeoutMs: 50, preparationTimeoutMs: 500,
          } });
          try {
            await session.login({ mode: 'password', account: 'offline-ci-account', secret: 'fixture-only' });
            const started = performance.now();
            await assert.rejects(session.loadDirectory(session.households()[0].id), { code: 'DOORS_LOAD_FAILED' });
            assert.equal(upgrades, 3); assert.equal(cancelled, 3);
            assert.ok(performance.now() - started < 1500);
            await delay(100); assert.equal(sockets.size, 0);
            console.log('Native silent-handshake cleanup passed: 3 attempts, 3 parallel HTTP cancellations, no leaked sockets.');
          } finally {
            session.clearLocal(); for (const socket of sockets) socket.destroy();
            await new Promise(resolve => server.close(resolve));
          }
          JS
      - name: Verify production startup and permissions
        shell: bash
        run: |
          set -euo pipefail
          image="$IMAGE:$VERSION-$ARCH"
          test "$(docker inspect --format '{{.Architecture}}' "$image")" = "$ARCH"
          docker run --rm --entrypoint sh "$image" -c 'test "$(id -u)" = 10001 && test -r /app/server/index.mjs && test -r /app/web/index.html'
          check_dir="$RUNNER_TEMP/opentyg-container-check"
          mkdir -p "$check_dir/data" "$check_dir/secrets"
          (umask 077; openssl rand -base64 32 > "$check_dir/secrets/app-secret.txt")
          sudo chown -R 10001:10001 "$check_dir"
          sudo chmod 700 "$check_dir/data" "$check_dir/secrets"
          sudo chmod 600 "$check_dir/secrets/app-secret.txt"
          trap 'if [[ $? -ne 0 ]]; then docker logs opentyg-image-check; fi; docker rm -f opentyg-image-check >/dev/null 2>&1 || true' EXIT
          docker run -d --name opentyg-image-check --read-only --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 100 --memory 512m --cpus 1 --init \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m -p 127.0.0.1:8787:8787 \
            -e PUBLIC_ORIGIN=https://opentyg.example.com -e COOKIE_SECURE=1 -e LOCAL_TEST_MODE=0 \
            -e ALLOW_INSECURE_UPSTREAM=1 -e APP_SECRET_FILE=/run/secrets/opentyg_secret \
            -v "$check_dir/data:/data" -v "$check_dir/secrets/app-secret.txt:/run/secrets/opentyg_secret:ro" "$image"
          curl --retry 10 --retry-delay 1 --retry-all-errors --retry-max-time 30 --connect-timeout 3 --max-time 5 -fsS http://127.0.0.1:8787/api/health
          docker exec opentyg-image-check node deploy/healthcheck.mjs
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/)" = 403
          curl -fsS -H 'Host: opentyg.example.com' http://127.0.0.1:8787/ > "$RUNNER_TEMP/opentyg-page.html"
          grep -q 'OpenTYG' "$RUNNER_TEMP/opentyg-page.html"
          echo "Verified linux/$ARCH: UID 10001, readonly root, mounted secret, persistent data, health endpoint, and home page." >> "$GITHUB_STEP_SUMMARY"
      - name: Log in to GitHub Container Registry
        if: env.OPERATION == 'publish'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified architecture image
        if: env.OPERATION == 'publish'
        run: docker push "$IMAGE:$VERSION-$ARCH"

  manifest:
    if: (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')) || inputs.operation == 'publish'
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
      IMAGE: ghcr.io/zjmdong/opentyg
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          docker buildx imagetools create -t "$IMAGE:$version" -t "$IMAGE:latest" "$IMAGE:$version-amd64" "$IMAGE:$version-arm64"
          docker buildx imagetools inspect "$IMAGE:$version"
          echo "Published $IMAGE:$version and $IMAGE:latest for linux/amd64 and linux/arm64." >> "$GITHUB_STEP_SUMMARY"
