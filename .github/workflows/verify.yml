name: Verify SDK
on:
  push:
    branches: [opentyg-sdk]
  pull_request:
    branches: [opentyg-sdk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund
      - name: Check source syntax
        run: find src vendor examples -name '*.mjs' -exec node --check {} \;
      - name: Check SDK packaging and platform routes without network operations
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {TygClient,ROUTES} from 'tyg-core-sdk';
          import {WindowsLoginStore} from 'tyg-core-sdk/login-store';
          const api=JSON.parse(readFileSync('docs/platform-openapi.json','utf8'));
          assert.equal(api.openapi,'3.1.0');
          assert.deepEqual(Object.keys(api.paths).sort(),Object.values(ROUTES).sort());
          const manifest=JSON.parse(readFileSync('docs/source-manifest.json','utf8'));
          for(const [path,hash] of Object.entries(manifest.files))
            assert.equal(createHash('sha256').update(readFileSync(path)).digest('hex'),hash);
          const client=new TygClient();
          assert.equal(client.getState().credentials.authenticated,false);
          assert.equal(typeof WindowsLoginStore,'function');
          client.close();
          JS
