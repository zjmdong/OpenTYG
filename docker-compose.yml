services:
  opentyg:
    image: ghcr.io/zjmdong/opentyg:${OPENTYG_VERSION:-1.2.2}
    container_name: opentyg
    restart: unless-stopped
    init: true
    # Set numeric IDs explicitly; containers do not inherit the host login user.
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
    ports:
      - "${LAN_BIND_IP:-127.0.0.1}:${APP_PORT:-8080}:8787"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to your public HTTPS origin in .env}
      COOKIE_SECURE: "1"
      APP_SECRET_FILE: /run/secrets/opentyg_secret
      TYG_ORIGIN: ${TYG_ORIGIN:-http://lxj.taoyuangu.com:80}
      UPSTREAM_ALLOWED_HOSTS: ${UPSTREAM_ALLOWED_HOSTS:-lxj.taoyuangu.com,uums.taoyuangu.com,sso.taoyuangu.com}
      ALLOW_INSECURE_UPSTREAM: ${ALLOW_INSECURE_UPSTREAM:-1}
      LOCAL_TEST_MODE: "0"
      LOG_QUIET: ${LOG_QUIET:-0}
    secrets:
      - opentyg_secret
    volumes:
      - type: bind
        source: ${APP_DATA_DIR:-./data}
        target: /data
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
secrets:
  opentyg_secret:
    file: ${APP_SECRET_PATH:-./secrets/opentyg_secret.txt}
