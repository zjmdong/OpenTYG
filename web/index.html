<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- color-scheme 让浏览器知道本页自己处理深浅色，从而不再强制反色 -->
<meta name="color-scheme" content="light dark">
<!-- 地址栏配色：带 media 的两个 meta 负责首屏与跟随系统；不带 media 的这个由 js/theme.js
     在用户手动切换主题时更新（否则手动选了与系统相反的主题时，地址栏会跟着系统走） -->
<meta name="theme-color" content="#EEF0F4">
<meta name="theme-color" content="#EEF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1016" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="description" content="OpenTYG 手机开门">
<meta name="application-name" content="OpenTYG">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OpenTYG">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<title>OpenTYG · 手机开门</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='8'%20fill='%232F6BED'/%3E%3Cpath%20d='M16%206.4a5%205%200%200%200-5%205v1.3h-1A1.5%201.5%200%200%200%208.5%2014v9A1.5%201.5%200%200%200%2010%2024.5h12A1.5%201.5%200%200%200%2023.5%2023v-9A1.5%201.5%200%200%200%2022%2012.7h-1v-1.3a5%205%200%200%200-5-5Zm0%202.4a2.6%202.6%200%200%201%202.6%202.6v1.3h-5.2v-1.3A2.6%202.6%200%200%201%2016%208.8Z'%20fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./css/style.css">
<link rel="stylesheet" href="/css/pwa.css">
<script>
  /* 首屏防闪：在 CSS 解析前就按用户选择设置 data-theme（与 js/theme.js 使用同一个 key） */
  (function () {
    try {
      var saved = localStorage.getItem('opentyg.theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
    } catch (e) { /* localStorage 不可用时保持跟随系统 */ }
  })();
</script>
</head>
<body>

  <!-- 手机外壳（桌面端居中显示 430px 宽的手机容器） -->
  <div id="app">
    <div class="screen">
      <main id="view" class="view" role="main"></main>
      <nav id="tabbar" class="tabbar is-hidden" aria-label="主导航"></nav>
    </div>
  </div>

  <!-- 浮层容器 -->
  <div id="toast-root" class="toast-root" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-root" class="modal-root"></div>
  <div id="sheet-root" class="sheet-root"></div>

  <noscript><div class="noscript">需要启用 JavaScript 才能使用 OpenTYG 手机开门。</div></noscript>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
