# Place this server block inside Nginx's http context.
# This example assumes Nginx runs directly on the Docker host.
server {
    listen 443 ssl;
    server_name opentyg.example.com;
    ssl_certificate     /etc/nginx/certs/opentyg/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/opentyg/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OpenTYG:10m;
    ssl_session_timeout 1d;
    client_max_body_size 64k;
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_cache off;
        proxy_buffering off;
    }
}
